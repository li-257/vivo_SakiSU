name: Build ksud
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      os:
        required: false
        type: string
        default: ubuntu-latest
      pack_lkm:
        required: false
        type: boolean
        default: true
      pack_ksuinit:
        required: false
        type: boolean
        default: true
      use_cache:
        required: false
        type: boolean
        default: true
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ${{ inputs.os }}
    continue-on-error: true
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare LKM fies
      if: ${{ inputs.pack_lkm }}
      run: |
        cp android*-lkm/*_kernelsu.ko ./userspace/ksud/bin/aarch64/
    
    - name: Prepare ksuinit
      if: ${{ inputs.pack_ksuinit }}
      run: |
        mv ksuinit/*/release/ksuinit ./userspace/ksud/bin/aarch64/
     
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly
        targets: ${{ inputs.target }}
        components: rust-src
        
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: ksud-${{ inputs.target }}-rust
        workspaces: userspace/ksud
        
    - name: Setup cargo-ndk
      run: cargo install cargo-ndk --locked
        
    - name: Patch ksud source for public ksu_props API
      run: |
        python3 - <<'PY'
        import pathlib
        root = pathlib.Path('userspace/ksud/src/android')
        patched = []
        def patch(name, pairs, guard='rebuild: false'):
            p = root / name
            s = p.read_text()
            if guard in s:
                print(f'skip {name}: already patched'); return
            for old, new in pairs:
                if old not in s:
                    print(f'!! MISSING pattern in {name}: {old[:70]!r}')
                s = s.replace(old, new)
            p.write_text(s); patched.append(name)
        patch('resetprop.rs', [
            ('show_context: cli.show_context,\n    };', 'show_context: cli.show_context,\n        rebuild: false,\n    };'),
            ('show_context: false,\n    };', 'show_context: false,\n        rebuild: false,\n    };'),
            ('        let context = cli.name().map(std::string::String::as_str);\n        let compacted = sys_prop::compact(context).context("compact failed")?;\n        if !compacted {\n            bail!("nothing to compact");\n        }\n        return Ok(());',
             '        let ctx = cli.name().cloned().unwrap_or_default();\n        sys_prop::rebuild(&ctx, false, false).context("rebuild failed")?;\n        return Ok(());'),
        ])
        patch('magica.rs', [
            ('show_context: false,\n    }', 'show_context: false,\n        rebuild: false,\n    }'),
            ('let _ = sys_prop::compact(Some(&ctx));', 'let _ = sys_prop::rebuild(&ctx, false, false);'),
        ])
        patch('init_event.rs', [
            ('show_context: false,\n    }', 'show_context: false,\n        rebuild: false,\n    }'),
        ])
        print('patched files:', patched)
        PY
    - name: Build ksud
      run: |
        cd userspace/ksud/
        cargo ndk b -P 26 -t ${{ inputs.target }} -r -Z trim-paths

    - name: Upload ksud artifact
      uses: actions/upload-artifact@v7
      with:
        name: ksud-${{ inputs.target }}
        path: userspace/ksud/target/**/release/ksud*
